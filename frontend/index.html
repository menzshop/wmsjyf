<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Kode untuk PWA -->
    <meta name="theme-color" content="#1858c9">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN - WMS</title>
    <script src="theme.js?v=2"></script>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="login-body">
    <div class="login-shell">

        <!-- PANEL MEREK -->
        <aside class="login-brand">
            <div class="brand-mark">
                <div class="brand-icon">
                    <svg class="ico" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                </div>
                <span class="brand-name">JYF WMS</span>
            </div>
            <div class="brand-copy">
                <h2>KELOLA GUDANG LEBIH TERTIB DAN TERUKUR</h2>
                <p>STOK, TRANSAKSI BARANG MASUK DAN KELUAR, SERTA LAPORAN GUDANG DALAM SATU SISTEM TERPUSAT.</p>
                <div class="brand-tags">
                    <span>STOK</span>
                    <span>TRANSAKSI</span>
                    <span>LAPORAN</span>
                </div>
            </div>
            <div class="brand-foot">&copy; 2026 JYF TEAM WAREHOUSE SYSTEM</div>
        </aside>

        <!-- PANEL FORM LOGIN -->
        <main class="login-panel">
            <div class="login-top">
                <div class="theme-switch" role="group" aria-label="PILIH TEMA">
                    <button type="button" class="theme-opt" data-theme-set="light" onclick="setTheme('light')">
                        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                        <span>TERANG</span>
                    </button>
                    <button type="button" class="theme-opt" data-theme-set="dark" onclick="setTheme('dark')">
                        <svg class="ico" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        <span>GELAP</span>
                    </button>
                </div>
            </div>

            <div class="login-box">
                <div class="logo">
                    <h1>MASUK</h1>
                    <p>WAREHOUSE MANAGEMENT SYSTEM</p>
                </div>
                <div class="login-card">
                    <form id="loginForm">
                        <div class="input-group">
                            <label for="username">USER</label>
                            <input type="text" id="username" placeholder="MASUKKAN USERNAME" autocomplete="username" required>
                        </div>
                        <div class="input-group">
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" placeholder="MASUKKAN PASSWORD" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn-login" id="btnLogin">LOGIN</button>
                        <div id="errorMsg" class="error-msg"></div>
                    </form>
                </div>
                <div class="footer">
                    <p>&copy; 2026 JYF TEAM WAREHOUSE SYSTEM</p>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js?v=2"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered with scope:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
